<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="巴士到站">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>巴士到站 · Bus ETA</title>
<link rel="stylesheet" href="style.css?v=134">
</head>
<body>
<div id="app">

  <!-- 顶部 -->
  <header id="topbar">
    <div class="tb-left">
      <div class="loc-row">
        <div id="loc-line" class="loc-line">—</div>
        <span id="stop-weather" class="wx-brief" hidden aria-label="天气"></span>
      </div>
      <div id="station-title" class="station-title">巴士到站</div>
    </div>
    <div class="tb-right">
      <div id="refresh-ring" class="ring" title="自动刷新倒计时"><svg viewBox="0 0 40 40"><circle class="ring-bg" cx="20" cy="20" r="16"/><circle id="ring-fg" class="ring-fg" cx="20" cy="20" r="16"/></svg><span id="ring-num">30</span></div>
      <button id="btn-refresh" class="icon-btn" aria-label="手动刷新">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>

  <!-- 快捷站点（仅在到站页签显示）：实时定位 + 常用站点，点击展开纵向列表 -->
  <div id="chips-row" hidden>
    <div class="quickbar">
      <button id="quick-trigger" class="quick-trigger" aria-label="快捷站点"><span class="quick-pin">▦</span><span id="quick-label">—</span><span class="quick-caret">▾</span></button>
      <button id="quick-locate" class="quick-locate" aria-label="实时定位">📍</button>
    </div>
    <nav id="chips" class="quick-menu" hidden></nav>
  </div>

  <main id="main">
    <!-- 到站板 -->
    <section id="view-stop" class="view">
      <div id="board-status" class="status-line"></div>
      <div id="board"></div>
    </section>

    <!-- 行程 -->
    <section id="view-trip" class="view" hidden>
      <div class="trip-toolbar"><span data-i18n="sort">排序</span><div class="seg" id="seg-trip-sort"><button data-sort="eta">按到站</button><button data-sort="add">按添加</button><button data-sort="route">按线路</button></div></div>
      <div id="trips-list"></div>
      <button id="btn-add-trip" class="btn-main ghost">+ 添加行程</button>
    </section>

    <!-- 线路 -->
    <section id="view-route" class="view" hidden>
      <div class="route-search-box">
        <input id="route-input" type="search" placeholder="输入路线号，如 272A / 582 / 806A" autocomplete="off" enterkeyhint="search">
      </div>
      <div id="fav-head" class="fav-head">
        <span id="fav-title" class="muted">关注线路</span>
        <button id="btn-fav-edit" class="link-btn">编辑</button>
      </div>
      <div id="fav-routes"></div>
      <div id="route-results"></div>
      <div id="route-board"></div>
    </section>

    <!-- 附近 -->
    <section id="view-nearby" class="view" hidden>
      <div class="nearby-bar">
        <div class="nearby-manual"><input id="near-input" type="search" autocomplete="off"><button id="near-go" class="pill-btn">定位</button></div>
        <button id="btn-locate" class="btn-main">定位附近站点</button>
        <button id="btn-nearby-refresh" class="icon-btn" aria-label="刷新"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
      </div>
      <div id="nearby-status" class="status-line"></div>
      <div id="nearby-list"></div>
    </section>

    <!-- 我的 -->
    <section id="view-settings" class="view" hidden>
      <h3 data-i18n="secAppearance">外观与语言</h3>
      <div class="set-row">
        <span data-i18n="language">界面语言</span>
        <div class="seg" id="seg-lang">
          <button data-lang="sc">简体</button>
          <button data-lang="tc">繁體</button>
          <button data-lang="en">EN</button>
        </div>
      </div>
      <div class="set-row">
        <span data-i18n="theme">主题</span>
        <button id="btn-theme" class="pill-btn">浅色</button>
      </div>
      <div class="set-row">
        <span data-i18n="refreshInterval">自动刷新间隔</span>
        <select id="sel-interval"><option value="15">15s</option><option value="30">30s</option><option value="60">60s</option></select>
      </div>

      <h3 data-i18n="myStops">常用站点</h3>
      <div id="mgr-stops"></div>
      <button id="btn-add-stop" class="btn-main ghost" data-i18n="addStopBtn">+ 添加站点</button>

      <h3 data-i18n="myRoutes">关注线路</h3>
      <div id="mgr-routes"></div>

      <h3 data-i18n="dataSec">数据与离线</h3>
      <div class="set-row"><span data-i18n="lastUpdate">本地数据更新于</span><span id="data-ts" class="muted">—</span></div>
      <button id="btn-update-data" class="btn-main" data-i18n="updateData">更新本地数据</button>
      <button id="btn-export" class="btn-main ghost" data-i18n="exportData">导出我的数据</button>
      <button id="btn-import" class="btn-main ghost" data-i18n="importData">导入我的数据</button>
      <input id="file-import" type="file" accept="application/json,.json" hidden>

      <button id="btn-install" class="btn-main" hidden data-i18n="install">安装到主屏幕</button>

      <div class="about">
        <div id="about-text" data-i18n="about"></div>
        <div id="ver-line" class="muted"></div>
      </div>
    </section>
  </main>

  <!-- 底部导航 -->
  <nav id="tabbar">
    <button class="tab active" data-view="stop"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 16a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm12 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM6 3c-1.1 0-2 .9-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H6zm0 2h12v7H6V5z"/></svg><span data-i18n="tabStops">到站</span></button>
    <button class="tab" data-view="trip"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h8v2H3V6zm0 5h18v2H3v-2zm10-5h8v2h-8V6zM3 16h12v2H3v-2zm14.6-.4 1.4 1.4 1.4-1.4L19 14.2l-1.4 1.4z"/></svg><span data-i18n="tabTrips">行程</span></button>
    <button class="tab" data-view="route"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 18h16v-2H4v2zM6 4v10h12V4H6zm2 2h8v6H8V6zM4 20h3v-1.5H4V20zm13 0h3v-1.5h-3V20z"/></svg><span data-i18n="tabRoute">线路</span></button>
    <button class="tab" data-view="nearby"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg><span data-i18n="tabNearby">附近</span></button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88L2.82 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.13-.56 1.62-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg><span data-i18n="tabMe">我的</span></button>
  </nav>

  <!-- 通用弹层：搜索 / 添加 -->
  <div id="modal" hidden>
    <div class="modal-mask"></div>
    <div class="modal-card">
      <div class="modal-head"><b id="modal-title">添加站点</b><button id="modal-close" class="icon-btn">✕</button></div>
      <input id="modal-search" type="search" placeholder="搜索站点名称" autocomplete="off" enterkeyhint="done">
      <div id="modal-results" class="modal-results"></div>
      <div id="modal-foot" class="modal-foot"></div>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>
<script src="app.js?v=134"></script>
</body>
</html>
